<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH SET 2020 Forensic Science - First 20 Questions</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e40af);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:20px;
    gap:10px;
}

.timer{
    background:#dc2626;
    color:white;
    padding:10px 16px;
    border-radius:10px;
    font-weight:bold;
}

.progress{
    width:100%;
    height:12px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:25px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#2563eb;
    transition:0.3s;
}

.question-box{
    background:#f9fafb;
    border:1px solid #ddd;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
    color:#111827;
}

.option{
    display:block;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    margin-bottom:10px;
    background:white;
    cursor:pointer;
    transition:0.3s;
}

.option:hover{
    background:#dbeafe;
}

input[type="radio"]{
    margin-right:10px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    margin-top:20px;
}

button:hover{
    background:#1d4ed8;
}

.result-section{
    display:none;
    text-align:center;
}

.score{
    font-size:60px;
    color:#16a34a;
    font-weight:bold;
    margin:20px 0;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}

.review{
    text-align:left;
    margin-top:25px;
}

.review-item{
    background:#f9fafb;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.solution {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #ccc;
    color: #444;
    font-style: italic;
}

@media(max-width:600px){
    .question{
        font-size:16px;
    }
    .score{
        font-size:40px;
    }
}
</style>
</head>

<body>

<div class="container">

<div id="examSection">
    <h1>MH SET Forensic Science Practice</h1>
    <p class="subtitle">First 20 Questions • Paper II Set A (Dec 27, 2020)</p>

    <div class="topbar">
        <div><strong>Total Questions:</strong> 20</div>
        <div class="timer">Time Left: <span id="timer">30:00</span></div>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <form id="quizForm"></form>

    <button onclick="submitQuiz()">Submit Exam</button>
</div>

<div class="result-section" id="resultSection">
    <h1>Exam Result</h1>
    <div class="score" id="scoreText">0/20</div>
    <div id="resultDetails"></div>
    <button onclick="showReview()">View Wrong Answers & Solutions</button>
    <button onclick="restartQuiz()">Restart Test</button>
    <div class="review" id="reviewBox"></div>
</div>

</div>

<script>
const questions = [
{
    question: "Which of the following sutures of the human skill closes first?",
    options: ["Sagittal", "Lambdoid", "Coronal", "Mid-frontal"],
    answer: 3,
    explanation: "The mid-frontal (metopic) suture is typically the first cranial suture to close, often fusing entirely by the time a child reaches 2 years of age."
},
{
    question: "The first Forensic Science Laboratory was started in the state of Maharashtra in the year:",
    options: ["1958", "1966", "1981", "1989"],
    answer: 0,
    explanation: "The first Forensic Science Laboratory in Maharashtra was established in Mumbai in the year 1958."
},
{
    question: "When in a proceeding, the court has to form an opinion on any matter relating to any information transmitted or stored in any computer, which of the following sections of Indian Evidence Act is relevant:",
    options: ["Section 45", "Section 454", "Section 46", "Section 47A"],
    answer: 1,
    explanation: "Section 45A (printed in the paper as '454' due to a likely typo) of the Indian Evidence Act deals with the opinion of the Examiner of Electronic Evidence."
},
{
    question: "During summer season, a corpse was found lying in open with pupae of housefly on the body. This indicates the time since death would be approximately:",
    options: ["1 day", "5 days", "10 days", "8 days"],
    answer: 3,
    explanation: "In warm summer conditions, houseflies typically reach the pupal stage around 8 to 10 days after eggs are laid."
},
{
    question: "Assertion: Wheel method of searching evidence is not suitable for larger area.<br>Reason: Investigator starts from a critical point and revolves into a circular fashion.",
    options: [
        "Both Assertion and Reason are true", 
        "Assertion is true but Reason is false", 
        "Assertion is false but Reason is true", 
        "Both Assertion and Reason are false"
    ],
    answer: 1,
    explanation: "The assertion is true, as the wheel/ray method is inefficient for vast areas. However, the reason describes the 'spiral' search method (revolving circularly), not the wheel method (which involves moving straight outward from a center point like spokes on a wheel). Thus, Reason is false."
},
{
    question: "Chain of custody means:",
    options: [
        "Continuity of possession", 
        "Custody of accused", 
        "Sampling process", 
        "Presenting matter to the court"
    ],
    answer: 0,
    explanation: "Chain of custody refers to the chronological documentation or paper trail that records the continuous possession, sequence of custody, control, transfer, and analysis of physical or electronic evidence."
},
{
    question: "Rate of charring of wood depends on all, except:",
    options: ["Intensity of fire", "Duration of exposure", "Moisture content", "Demarcation line"],
    answer: 3,
    explanation: "The rate of charring is affected by fire intensity, exposure duration, and wood moisture. The 'demarcation line' is a resulting visual feature of the charred wood, not a factor that determines the rate."
},
{
    question: "The method of Stass was modified by Otto for the removal of which of the following?",
    options: ["Bone", "Fat", "Tissue", "Water"],
    answer: 1,
    explanation: "The Stas-Otto method is a classic technique for extracting alkaloids and poisons from tissue. Otto modified Stas's original method to better remove fats and proteins using alcohol."
},
{
    question: "Footwear impression in snow is:",
    options: [
        "Three-dimensional impression", 
        "Positive two-dimensional impression", 
        "A flat impression", 
        "A negative two-dimensional impression"
    ],
    answer: 0,
    explanation: "Impressions left in soft, yielding surfaces like snow, mud, or sand possess length, width, and depth, making them three-dimensional."
},
{
    question: "Which of the following sketching methods is the most suitable for large outdoor crime scene?",
    options: ["Triangulation", "Photogrammetry", "Baseline", "Polar coordinate"],
    answer: 3,
    explanation: "The polar coordinate method is highly suitable for large outdoor scenes, utilizing a datum point and mapping evidence based on distance and angle."
},
{
    question: "Which of the following is not an early change observed in eye after death?",
    options: [
        "Segmentation of retinal blood columns", 
        "Increase in intraocular pressure", 
        "Loss of corneal reflex", 
        "Increase in potassium concentration in vitreous humor"
    ],
    answer: 1,
    explanation: "After death, intraocular pressure drops rapidly (it decreases, it does not increase), leaving the eyes noticeably softer."
},
{
    question: "The value of induced dipole moment divided by strength of the field is better known as:",
    options: ["Polarizability", "Total dipole moment", "Unit dipole moment", "Depolarization"],
    answer: 0,
    explanation: "Polarizability is defined as the measure of how easily an electron cloud is distorted by an electric field, mathematically equal to the induced dipole moment divided by the field strength."
},
{
    question: "The formulae given by which of the following can be helpful in estimation of age of unknown human skeletal remains?",
    options: ["Trotter and Gleser", "Gustafsons's", "Dupertius and Hadden", "Pearson's"],
    answer: 1,
    explanation: "Gustafson's method evaluates six changes in teeth to estimate a person's age. Trotter/Gleser and Pearson's methods are used for stature/height estimation."
},
{
    question: "Which of the following compounds is infra-red inactive?",
    options: ["Ethylene", "Hydrochloric acid", "Carbon monoxide", "Nitric acid"],
    answer: 0,
    explanation: "IR absorption requires a change in dipole moment during vibration. Highly symmetric molecules like Ethylene (C2H4) have modes that do not result in a net dipole change, rendering those specific vibrations IR inactive compared to polar molecules like HCl or CO."
},
{
    question: "Precolumn used for the conditioning of mobile phase is known as:",
    options: ["Guard column", "Scavenger column", "Conditioning column", "Mobilizing column"],
    answer: 1,
    explanation: "A scavenger column is placed between the pump and injector to condition the mobile phase (e.g., saturating it with silica) to prevent the analytical column from degrading."
},
{
    question: "Time-of-flight mass spectrometry operates in:",
    options: ["Continuous mode", "Pulse mode", "Direct mode", "Syntactic mode"],
    answer: 1,
    explanation: "TOF mass spectrometry operates in pulse mode, firing distinct packets of ions into the flight tube rather than a continuous stream."
},
{
    question: "Which of the following is the correct sequence of the components of a monochromator in Emission Spectrometry?",
    options: [
        "Entrance slit, focusing lens, collimating lens, prism, exit slit", 
        "Entrance slit, collimating lens, prism, focusing lens, exit slit", 
        "Exit slit, prism, collimating lens, focusing lens, entrance slit", 
        "Entrance slit, prism, collimating lens, focusing lens, exit slit"
    ],
    answer: 1,
    explanation: "Light enters the entrance slit, is made parallel by the collimating lens, dispersed by the prism/grating, and focused by a focusing lens onto the exit slit."
},
{
    question: "Distortion of glass article on fire suggests that the temperature reached:",
    options: ["Below 750°C", "750°C to 850°C", "1000°C to 1500°C", "1500°C to 2000°C"],
    answer: 1,
    explanation: "Standard window and container glass begin to soften and distort at temperatures typically falling between 700°C and 850°C during a fire."
},
{
    question: "A man committed suicide by a 0.357 revolver in hard contact of his head. Blood stains were found in the barrel of the revolver due to:",
    options: ["Back spatter", "Forward spatter", "Blowback effect", "Impact effect"],
    answer: 2,
    explanation: "When a weapon is fired in hard contact with flesh, the rapidly expanding gases are forced into the tissue and violently rebound, carrying blood and tissue back into the barrel. This is called the blowback effect."
},
{
    question: "In HPLC, LOD and LOQ are obtained using:",
    options: [
        "Retention time to Signal ratio", 
        "Efficiency to Asymmetry ratio", 
        "Signal to Noise ratio", 
        "Retention time to Dead time ratio"
    ],
    answer: 2,
    explanation: "Limit of Detection (LOD) and Limit of Quantitation (LOQ) are conventionally determined based on the Signal-to-Noise (S/N) ratio, typically 3:1 for LOD and 10:1 for LOQ."
}
];

const form = document.getElementById("quizForm");

function loadQuestions(){
    form.innerHTML = "";
    questions.forEach((q, index) => {
        form.innerHTML += `
        <div class="question-box">
            <div class="question">Q${index + 1}. ${q.question}</div>
            ${q.options.map((option, i) => `
            <label class="option">
                <input type="radio" name="q${index}" value="${i}" onchange="updateProgress()">
                ${option}
            </label>
            `).join("")}
        </div>
        `;
    });
}

let wrongAnswers = [];

function submitQuiz(){
    let score = 0;
    wrongAnswers = [];

    questions.forEach((q, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if(selected && parseInt(selected.value) === q.answer){
            score++;
        } else {
            wrongAnswers.push({
                question: q.question,
                selected: selected ? q.options[selected.value] : "Not Answered",
                correct: q.options[q.answer],
                explanation: q.explanation
            });
        }
    });

    document.getElementById("examSection").style.display = "none";
    document.getElementById("resultSection").style.display = "block";
    document.getElementById("scoreText").innerText = `${score}/${questions.length}`;

    const percentage = ((score / questions.length) * 100).toFixed(2);
    document.getElementById("resultDetails").innerHTML = `
        <h2>Correct: <span class="correct">${score}</span></h2><br>
        <h2>Wrong: <span class="wrong">${questions.length - score}</span></h2><br>
        <h2>Percentage: ${percentage}%</h2>
    `;
    clearInterval(timerInterval);
}

function showReview(){
    const reviewBox = document.getElementById("reviewBox");
    if(wrongAnswers.length === 0){
        reviewBox.innerHTML = `<h2 style="color:green;">Excellent! No wrong answers.</h2>`;
        return;
    }

    reviewBox.innerHTML = "<h2 style='margin-bottom:20px;'>Wrong Answers & Solutions</h2>";
    
    wrongAnswers.forEach((item, index) => {
        reviewBox.innerHTML += `
        <div class="review-item">
            <strong>Q. ${item.question}</strong><br><br>
            <span class="wrong">Your Answer: ${item.selected}</span><br><br>
            <span class="correct">Correct Answer: ${item.correct}</span>
            <div class="solution"><strong>Solution:</strong> ${item.explanation}</div>
        </div>
        `;
    });
}

function restartQuiz(){
    document.getElementById("resultSection").style.display = "none";
    document.getElementById("examSection").style.display = "block";
    
    // Reset inputs
    document.querySelectorAll('input[type="radio"]').forEach(radio => radio.checked = false);
    
    timeLeft = 1800; // Reset to 30 mins
    updateProgress();
    startTimer();
}

function updateProgress(){
    const answered = document.querySelectorAll("input[type='radio']:checked").length;
    const percent = (answered / questions.length) * 100;
    document.getElementById("progressBar").style.width = percent + "%";
}

let timeLeft = 1800; // 30 minutes for 20 questions
let timerInterval;

function startTimer(){
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        
        seconds = seconds < 10 ? "0" + seconds : seconds;
        document.getElementById("timer").innerText = `${minutes}:${seconds}`;
        
        if(timeLeft <= 0){
            clearInterval(timerInterval);
            submitQuiz();
        }
        timeLeft--;
    }, 1000);
}

loadQuestions();
startTimer();
</script>

</body>
</html>
